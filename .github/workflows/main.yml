name: Auto Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 工程在 app/build.gradle.kts 与 core-apk/build.gradle.kts 里把 CMake 版本
    # 固定为 3.31.6,而 runner 镜像自带的 CMake 版本随镜像更新而变
    # (ubuntu-24.04 预装过 3.31.6,ubuntu-26.04 起不再预装),于是同一份代码
    # 会在新镜像上以 "[CXX1300] CMake '3.31.6' was not found" 失败。
    # 这里显式从 SDK 安装,让构建不再依赖镜像预装内容。
    - name: Install CMake 3.31.6
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER=$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
        fi
        echo "sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" --install "cmake;3.31.6"
        "$SDKMANAGER" --list_installed | grep -i cmake || true

    - name: Decode keystore
      run: echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > ${{ runner.temp }}/star.jks

    - name: Build Signed Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ runner.temp }}/star.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

    - name: Upload Signed APK
      uses: actions/upload-artifact@v5
      with:
        name: signed-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 1