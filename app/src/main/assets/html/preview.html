<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/github-markdown-light.min.css">
    <link rel="stylesheet" href="css/github.min.css">
    <!-- 主题层必须最后加载:它按 CSS 变量覆盖上面两套硬编码浅色主题 -->
    <link rel="stylesheet" href="css/doc-theme.css">
    <style>
        body {
            margin: 0;
            /* 颜色改由 css/doc-theme.css 的变量统一驱动,此处只保留布局 */
            background-color: var(--doc-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 24px;
            background: var(--doc-bg);
            border-radius: 0px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        pre {
            position: relative;
            margin: 1em 0 !important;
            padding: 0;
            background: transparent !important;
            border: 1px solid var(--doc-pre-border) !important;
            border-radius: 14px !important;
            overflow: hidden;
            box-shadow: none !important;
        }
        pre code.hljs {
            display: block;
            overflow-x: auto;
            padding: 16px;
            padding-top: 48px;
            background: transparent !important;
        }
        .code-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            background: transparent !important;
            z-index: 10;
            box-sizing: border-box;
        }
        .code-language {
            font-size: 12px;
            font-weight: 500;
            color: var(--doc-muted);
            background: transparent !important;
            border: none !important;
            padding: 5px 10px;
            border-radius: 0 !important;
            box-shadow: none !important;
            opacity: 0.8;
        }
        .copy-button {
            font-size: 12px;
            font-weight: 500;
            padding: 6px 16px;
            background: var(--doc-bg);
            color: var(--doc-muted);
            border: 1px solid var(--doc-border);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.25s ease;
            box-shadow: none !important;
        }
        pre:hover .copy-button {
            opacity: 1;
        }
        .copy-button:hover {
            background: var(--doc-muted);
            color: var(--doc-bg);
            box-shadow: none !important;
        }
        .copy-button.copied {
            color: var(--doc-muted);
            border-color: var(--doc-border) !important;
            background: var(--doc-bg) !important;
        }
        .copy-button.copied:hover {
            background: var(--doc-bg) !important;
        }
        .markdown-body hr {
            height: 1px !important;
            background-color: var(--doc-hr) !important;
            border: none !important;
            margin: 32px 0 !important;
        }
        .markdown-body code:not(pre code),
        .markdown-body tt:not(pre tt) {
            background-color: var(--doc-inline-code-bg) !important;
            color: var(--doc-inline-code-fg) !important;
            border-radius: 6px !important;
            padding: .2em .4em !important;
            font-size: 85% !important;
        }
        .markdown-body table {
            border-collapse: collapse;
            background: transparent !important;
            border: none !important;
            margin: 1em 0;
            display: table;
            width: auto;
            max-width: 100%;
            overflow-x: auto;
        }
        .markdown-body table th,
        .markdown-body table td {
            padding: 12px 16px !important;
            border: none !important;
            border-bottom: 1px solid var(--doc-hr) !important;
            background: transparent !important;
            text-align: left;
            vertical-align: top;
        }
        .markdown-body table tr {
            background: transparent !important;
            border-top: none !important;
        }
        .markdown-body table tr:nth-child(2n) {
            background: transparent !important;
        }
        .markdown-body table th {
            font-weight: 600;
            color: var(--doc-bg);
            border-bottom: 2px solid var(--doc-table-head-border) !important;
            padding-bottom: 10px !important;
        }
        .markdown-body table code,
        .markdown-body table tt {
            background-color: var(--doc-inline-code-bg) !important;
            color: var(--doc-inline-code-fg) !important;
            border-radius: 6px !important;
            padding: .2em .4em !important;
            font-size: 85% !important;
        }
        .markdown-body table {
            display: block;
            overflow-x: auto;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .markdown-body table th,
            .markdown-body table td {
                padding: 8px 12px !important;
            }
        }
        .markdown-body table th:first-child,
        .markdown-body table td:first-child {
            border-left: none !important;
        }
        .markdown-body table th:last-child,
        .markdown-body table td:last-child {
            border-right: none !important;
        }
    </style>
</head>
<body>
<article class="markdown-body" id="preview"></article>
<script src="js/marked.min.js"></script>
<script src="js/highlight.min.js"></script>
<script src="js/lua.min.js"></script>
<script src="js/preview.js"></script>
</body>
</html>
